
{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Crear nueva tarea</h2>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-dark w-100" type="submit">
                        Guardar tarea
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
