
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de Tareas en Django</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            Django CRUD
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'home' %}">
                Home
            </a>

            {% if user.is_authenticated %}

                <a class="nav-link" href="{% url 'tasks' %}">
                    Tasks Pending
                </a>

                <a class="nav-link" href="{% url 'tasks_completed' %}">
                    Tasks Completed
                </a>

                <a class="nav-link" href="{% url 'create_task' %}">
                    Create Task
                </a>

                <form method="POST" action="{% url 'logout' %}" class="d-flex">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link">
                        Logout
                    </button>
                </form>

            {% else %}

                <a class="nav-link" href="{% url 'signin' %}">
                    Iniciar Sesión
                </a>

                <a class="nav-link" href="{% url 'signup' %}">
                    Crear Cuenta
                </a>

            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
